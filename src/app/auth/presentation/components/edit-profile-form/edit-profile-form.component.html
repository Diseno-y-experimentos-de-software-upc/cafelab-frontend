<div class="profile-edit-container">
  <div class="profile-right" style="width:100%;margin:auto;">
    <form class="profile-form" [formGroup]="editProfileForm">
      <div class="form-row">
        <div class="form-group">
          <label>{{ 'EDIT_PROFILE.NAME' | translate }}</label>
          <input type="text" formControlName="name" [ngClass]="{'invalid': isInvalidControl(editProfileForm, 'name')}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>
            {{ 'EDIT_PROFILE.CAFETERIA_NAME' | translate }}
            <span *ngIf="isCafeteriaNameRequired" class="required-mark" title="{{ 'EDIT_PROFILE.CAFETERIA_REQUIRED_HINT' | translate }}">*</span>
          </label>
          <input type="text" formControlName="cafeteriaName" [ngClass]="{'invalid': isInvalidControl(editProfileForm, 'cafeteriaName')}">
          <p *ngIf="isCafeteriaNameRequired" class="field-hint">{{ 'EDIT_PROFILE.CAFETERIA_REQUIRED_HINT' | translate }}</p>
        </div>

        <div class="form-group">
          <label>{{ 'EDIT_PROFILE.EMAIL' | translate }}</label>
          <input type="email" formControlName="email" [ngClass]="{'invalid': isInvalidControl(editProfileForm, 'email')}">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" [disabled]="!editProfileForm.valid" (click)="continueToSelectPlan()">
          {{ 'EDIT_PROFILE.CONTINUE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
